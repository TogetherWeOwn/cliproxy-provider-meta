name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            go.sum
            integration/hostcompat/go.sum
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gcc binutils zip python3-jsonschema
      - name: Isolated scratch directory
        run: |
          mkdir -p "$HOME/.cache"
          echo "TMPDIR=$(mktemp -d "$HOME/.cache/meta-ci.XXXXXX")" >> "$GITHUB_ENV"
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go') $(git ls-files --others --exclude-standard '*.go'))"
      - name: Stock module graphs and toolchain provenance
        run: |
          go version | tee "$TMPDIR/toolchain.txt"
          go mod tidy -diff
          go -C integration/hostcompat mod tidy -diff
          go list -m -json all > "$TMPDIR/root-modules.json"
          go -C integration/hostcompat list -m -json all > "$TMPDIR/loader-modules.json"
          test "$(go list -m -f '{{.Version}}' github.com/router-for-me/CLIProxyAPI/v8)" = v8.0.63
          test "$(go -C integration/hostcompat list -m -f '{{.Version}}' github.com/router-for-me/CLIProxyAPI/v8)" = v8.0.63
          test "$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' github.com/router-for-me/CLIProxyAPI/v8)" = ''
          test "$(go -C integration/hostcompat list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' github.com/router-for-me/CLIProxyAPI/v8)" = ''
      - name: Vet
        run: |
          go vet ./...
          go -C integration/hostcompat vet ./...
      - name: Race tests and release packaging contract
        run: META_REPLAY_EXAMPLES_OUT="$TMPDIR/replay-events.ndjson" META_REPLAY_FAILURE_EXAMPLES_OUT="$TMPDIR/replay-failure.ndjson" go test -race -count=1 ./...
      - name: Actual producer schema and examples
        run: |
          /usr/bin/python3 -I scripts/check-replay-examples.py docs/replay-event-v1.schema.json "$TMPDIR/replay-events.ndjson" "$TMPDIR/replay-failure.ndjson"
          /usr/bin/python3 -I scripts/check-replay-examples.py docs/replay-event-v1.schema.json docs/replay-events.example.ndjson
      - name: Real stock v8.0.63 host loader compatibility
        run: go -C integration/hostcompat test -race -count=1 ./...
      - name: Production C shared library
        run: |
          bash scripts/package-release.sh "$TMPDIR/package"
          unzip -p "$TMPDIR/package/"*.zip meta.so > "$TMPDIR/meta.so"
          go version -m "$TMPDIR/meta.so" > "$TMPDIR/library-modules.txt"
          nm -D "$TMPDIR/meta.so" > "$TMPDIR/symbols.txt"
          grep -q ' T cliproxy_plugin_init$' "$TMPDIR/symbols.txt"
          META_HOSTCOMPAT_LIBRARY="$TMPDIR/meta.so" go -C integration/hostcompat test -race -count=1 -run '^TestRealHostLoader$' -v ./...
      - name: Released-source contributor regression must fail
        run: |
          git fetch --no-tags origin c5358edd569de4bc82b6abe924c521588f3127c3
          mkdir "$TMPDIR/baseline"
          git archive c5358edd569de4bc82b6abe924c521588f3127c3 | tar -x -C "$TMPDIR/baseline"
          cp contributor_transport_test.go "$TMPDIR/baseline/"
          set +e
          go -C "$TMPDIR/baseline" test -count=1 -run '^TestContributorTransportMatrix$/^false$/^muse-spark-1.3$' . > "$TMPDIR/contributor-baseline.log" 2>&1
          result=$?
          set -e
          cat "$TMPDIR/contributor-baseline.log"
          test "$result" -ne 0
          grep -q 'contributor keys/values = 1/1, want opt-in=false' "$TMPDIR/contributor-baseline.log"
      - name: Pre-fix idle stream cancellation must fail
        run: |
          git fetch --no-tags origin 580bf8f7f54438585c2cb35e666e4310fa229009
          mkdir "$TMPDIR/stream-baseline"
          git archive 580bf8f7f54438585c2cb35e666e4310fa229009 | tar -x -C "$TMPDIR/stream-baseline"
          cp sdk59_stream_test.go "$TMPDIR/stream-baseline/"
          set +e
          go -C "$TMPDIR/stream-baseline" test -count=1 -run '^TestSDK59PumpCancellation$/^false$' . > "$TMPDIR/stream-baseline.log" 2>&1
          result=$?
          set -e
          cat "$TMPDIR/stream-baseline.log"
          test "$result" -ne 0
          grep -q 'pump did not stop on cancellation with upstream still open' "$TMPDIR/stream-baseline.log"
      - name: Pre-fix nested errors and Gemini carrier replay must fail
        run: |
          cp contributor_transport_test.go sdk59_replay_test.go "$TMPDIR/stream-baseline/"
          : > "$TMPDIR/replay-baseline.log"
          for regression in TestSDK59PumpTerminalErrors TestContributorRetryTransport TestSDK59GeminiCarrierReplay; do
            set +e
            go -C "$TMPDIR/stream-baseline" test -count=1 -run "^${regression}$" . > "$TMPDIR/regression.log" 2>&1
            result=$?
            set -e
            cat "$TMPDIR/regression.log" | tee -a "$TMPDIR/replay-baseline.log"
            test "$result" -ne 0
            grep -q -- "--- FAIL: $regression" "$TMPDIR/regression.log"
          done
      - name: Secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          gitleaks dir --redact --no-banner .
          python3 -I scripts/check-public-files.py .
      - name: Retain package provenance and regression evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-package-evidence-${{ github.sha }}
          path: |
            ${{ env.TMPDIR }}/package/*
            ${{ env.TMPDIR }}/symbols.txt
            ${{ env.TMPDIR }}/root-modules.json
            ${{ env.TMPDIR }}/loader-modules.json
            ${{ env.TMPDIR }}/library-modules.txt
            ${{ env.TMPDIR }}/toolchain.txt
            ${{ env.TMPDIR }}/contributor-baseline.log
            ${{ env.TMPDIR }}/stream-baseline.log
            ${{ env.TMPDIR }}/replay-baseline.log
          if-no-files-found: error
          retention-days: 14
      - name: Remove scratch directory
        if: always()
        run: |
          if [[ -n "${TMPDIR:-}" && "$TMPDIR" == "$HOME/.cache/meta-ci."* ]]; then rm -rf -- "$TMPDIR"; fi
